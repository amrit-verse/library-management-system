
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Books</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
    <div class="topbar" style="padding-top:2rem;">
        <div>
            <h1>Search Books</h1>
            <p style="color:var(--muted);">Quickly search books in the library database.</p>
        </div>

        <a href="admin-dashboard.html" class="btn btn-secondary">Dashboard</a>
    </div>

    <div class="form-group">
        <input type="text" placeholder="Search by title, author, or category">
    </div>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Rack</th>
                </tr>
            </thead>

            <tbody id="booksTableBody">

            </tbody>
        </table>
    </section>
</div>

<script>
async function loadBooks() {

    try {

        const response = await fetch("http://localhost:8080/books");

        const books = await response.json();

        const tableBody = document.getElementById("booksTableBody");

        tableBody.innerHTML = "";

        books.forEach(book => {

            tableBody.innerHTML += `
                <tr>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>
                        <span class="status ${book.available ? 'available' : 'issued'}">
                            ${book.available ? 'Available' : 'Issued'}
                        </span>
                    </td>
                    <td>${book.category}</td>
                </tr>
            `;
        });

    } catch(error) {
        console.error("Error loading books:", error);
    }
}

loadBooks();
</script>
</body>
</html>
