<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search Books</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body onload="initializeSearchPage()">

    <div class="dashboard">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>LibraSphere</h2>

            <ul>

                <li>
                    <a href="admin-dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="manage-books.html">
                        <i class="fa-solid fa-book"></i>
                        Manage Books
                    </a>
                </li>

                <li>
                    <a
                        class="active"
                        href="search-books.html"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search Books
                    </a>
                </li>

                <li>
                    <a href="user-dashboard.html">
                        <i class="fa-solid fa-users"></i>
                        User Panel
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- MAIN CONTENT -->

        <main class="main">

            <!-- TOPBAR -->

            <div class="topbar">

                <div>

                    <h1>Search Books</h1>

                    <p class="welcome-text">
                        Quickly search books from the library database.
                    </p>

                </div>

            </div>

            <!-- SEARCH BAR -->

            <div class="search-bar-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by title, author, or category..."
                >

            </div>

            <!-- TABLE CARD -->

            <div class="table-card">

                <div class="table-header">

                    <h2>Library Collection</h2>

                    <span id="bookCount">
                        0 Books
                    </span>

                </div>

                <!-- LOADING -->

                <div
                    id="loadingState"
                    class="loading-state"
                >
                    Loading books...
                </div>

                <!-- EMPTY STATE -->

                <div
                    id="emptyState"
                    class="empty-state"
                    style="display:none;"
                >

                    <i class="fa-solid fa-book-open"></i>

                    <p>No matching books found</p>

                </div>

                <!-- TABLE -->

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Title</th>

                                <th>Author</th>

                                <th>Status</th>

                                <th>Category</th>

                            </tr>

                        </thead>

                        <tbody id="booksTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- SCRIPTS -->

    <script src="../js/auth.js"></script>

    <script>

        const API_URL =
            "https://library-management-system-wgmk.onrender.com/books";

        let allBooks = [];

        function initializeSearchPage() {

            protectRoute();

            loadBooks();

            setupSearch();
        }

        /* =========================
           LOAD BOOKS
        ========================= */

        async function loadBooks() {

            const loadingState =
                document.getElementById("loadingState");

            try {

                loadingState.style.display = "block";

                const response =
                    await fetch(API_URL);

                const books =
                    await response.json();

                allBooks = books;

                renderBooks(books);

                updateBookCount(books);

            } catch(error) {

                console.error(
                    "Error loading books:",
                    error
                );

            } finally {

                loadingState.style.display = "none";
            }
        }

        /* =========================
           RENDER BOOKS
        ========================= */

        function renderBooks(books) {

            const tableBody =
                document.getElementById("booksTableBody");

            const emptyState =
                document.getElementById("emptyState");

            tableBody.innerHTML = "";

            if (books.length === 0) {

                emptyState.style.display = "flex";

                return;

            } else {

                emptyState.style.display = "none";
            }

            books.forEach(book => {

                tableBody.innerHTML += `

                    <tr>

                        <td>${book.id}</td>

                        <td>${book.title}</td>

                        <td>${book.author}</td>

                        <td>

                            <span class="
                                status
                                ${book.available
                                    ? 'available'
                                    : 'issued'}
                            ">

                                ${book.available
                                    ? 'Available'
                                    : 'Borrowed'}

                            </span>

                        </td>

                        <td>${book.category}</td>

                    </tr>
                `;
            });
        }

        /* =========================
           SEARCH
        ========================= */

        function setupSearch() {

            const searchInput =
                document.getElementById("searchInput");

            searchInput.addEventListener("input", () => {

                const searchTerm =
                    searchInput.value.toLowerCase();

                const filteredBooks =
                    allBooks.filter(book => {

                    return (

                        book.title
                            .toLowerCase()
                            .includes(searchTerm)

                        ||

                        book.author
                            .toLowerCase()
                            .includes(searchTerm)

                        ||

                        book.category
                            .toLowerCase()
                            .includes(searchTerm)
                    );
                });

                renderBooks(filteredBooks);

                updateBookCount(filteredBooks);
            });
        }

        /* =========================
           BOOK COUNT
        ========================= */

        function updateBookCount(books) {

            document.getElementById("bookCount")
                .textContent =
                `${books.length} Books`;
        }

    </script>

</body>

</html>
