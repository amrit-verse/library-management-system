
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Books</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
    <div class="topbar" style="padding-top:2rem;">
        <div>
            <h1>Manage Books</h1>
            <p style="color:var(--muted);">Add, edit, and organize your library collection.</p>
        </div>

        <a href="admin-dashboard.html" class="btn btn-secondary">Back</a>
    </div>

    <div class="form-card">
        <h2 style="margin-bottom:1.5rem;">Add New Book</h2>

        <div class="form-group">
            <input type="text" placeholder="Book Title">
        </div>

        <div class="form-group">
            <input type="text" placeholder="Author Name">
        </div>

        <div class="form-group">
            <input type="text" placeholder="Category">
        </div>

        <div class="form-group">
            <input type="number" placeholder="Quantity">
        </div>

        <button class="btn btn-primary" style="width:100%;">
            Save Book
        </button>
    </div>
</div>

</body>
</html>
