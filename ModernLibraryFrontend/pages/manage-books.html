<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Books</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body onload="initializeManageBooks()">

    <div class="dashboard">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>LibraSphere</h2>

            <ul>

                <li>
                    <a href="admin-dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a
                        class="active"
                        href="manage-books.html"
                    >
                        <i class="fa-solid fa-book"></i>
                        Manage Books
                    </a>
                </li>

                <li>
                    <a href="search-books.html">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search Books
                    </a>
                </li>

                <li>
                    <a href="user-dashboard.html">
                        <i class="fa-solid fa-users"></i>
                        User Panel
                    </a>
                </li>

                <li>
                    <a href="#" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- MAIN CONTENT -->

        <main class="main">

            <!-- TOPBAR -->

            <div class="topbar">

                <div>

                    <h1>Manage Books</h1>

                    <p class="welcome-text">
                        Add, edit, delete, and organize books.
                    </p>

                </div>

            </div>

            <!-- SEARCH BAR -->

            <div class="search-bar-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by title, author, or category..."
                >

            </div>

            <!-- FORM CARD -->

            <div class="form-card">

                <div class="form-header">

                    <h2 id="formTitle">
                        Add New Book
                    </h2>

                </div>

                <form id="bookForm">

                    <input type="hidden" id="bookId">

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Book Title</label>

                            <input
                                type="text"
                                id="title"
                                placeholder="Enter book title"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Author</label>

                            <input
                                type="text"
                                id="author"
                                placeholder="Enter author name"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Category</label>

                            <input
                                type="text"
                                id="category"
                                placeholder="Enter category"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-actions">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="submitBtn"
                        >
                            <i class="fa-solid fa-plus"></i>
                            Add Book
                        </button>

                        <button
                            type="button"
                            class="btn btn-danger"
                            id="cancelEditBtn"
                            style="display:none;"
                            onclick="cancelEdit()"
                        >
                            Cancel Edit
                        </button>

                    </div>

                </form>

            </div>

            <!-- TABLE CARD -->

            <div class="table-card">

                <div class="table-header">

                    <h2>Library Books</h2>

                    <span id="bookCount">
                        0 Books
                    </span>

                </div>

                <!-- LOADING -->

                <div
                    id="loadingState"
                    class="loading-state"
                >
                    Loading books...
                </div>

                <!-- EMPTY STATE -->

                <div
                    id="emptyState"
                    class="empty-state"
                    style="display:none;"
                >

                    <i class="fa-solid fa-book-open"></i>

                    <p>No books found</p>

                </div>

                <!-- TABLE -->

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Title</th>

                                <th>Author</th>

                                <th>Category</th>

                                <th>Status</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="bookTableBody"></tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- SCRIPTS -->

    <script src="../js/auth.js"></script>

    <script src="../js/app.js"></script>

    <script>

        function initializeManageBooks() {

            protectRoute("admin");

            loadBooks();

            setupSearch();
        }

        document
            .getElementById("bookForm")
            .addEventListener("submit", addBook);

    </script>

</body>

</html>
